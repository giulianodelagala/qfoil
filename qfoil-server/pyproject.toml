[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qfoil-server"
version = "0.1.0"
description = "Thin HTTP adapter for the QFOIL Python API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "qfoil>=0.1.0",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
random_forest = [
  "qfoil[random_forest]>=0.1.0",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
pyjuice = [
  "qfoil[pyjuice]>=0.1.0",
]

[project.scripts]
qfoil-server = "qfoil_server.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: marks tests that require a CUDA device and a real PyJuice model",
]

[tool.ruff]
line-length = 88
target-version = "py310"
